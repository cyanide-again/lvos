<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css">
        <title>Web Universal Metronome</title>
        
    </head>
    <body>
        <main>
            <div class="controls">
                <p>
                    <button id="pauseButton">Play</button>
                    <span id="beatNum"></span>
                </p>
            </div>
            <div class="bpm">
                <label for="bpmInput">BPM: </label>
                <input type="number" id="bpmInput" value="120" min="1" required step="any"></input>
            </div>
            <div class="timesig">
                <p><label for="numeratorInput">Time Signature: </label><input class="numberInput" type="number" id="numeratorInput" value="7" min="1" required step="any"><label for="denominatorInput"> / </label><input class="numberInput" type="number" id="denominatorInput" value="8" min="1" required step="any"></p>
            </div>
            <div class="volumeControl">
            <label for="gain">Volume: </label><input id="gain" type="range" min="0" max="1" step="0.01" value="1"><label for="gain" id="gainDisplay"> 100%</label>
                
            </div>
        </main>
        <script src="metronome.js"></script>
    </body>
</html>
