<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css">
        <title>Rainbowify</title>
    </head>
    <body>
        <main>
            <div class="input">
                <label for="fileInput">Enter image: </label>
                <input id="fileInput" type="file" accept="image/jpeg, image/png, image/webp, image/tiff, image/gif, image/svg">
            </div>
            <div class="output">
                <img id="inputImg" src="" alt="Input Image Preview">
                <img id="outputImg" src="" alt="Output Image Preview">
            </div>
            <div class="settings">
                <label for="hueMultiplier">Hue Multiplier: </label>
                <input type="range" id="hueMultiplier" min="0" max="200" value="0">
                <label for="saturationMultiplier">Saturation Multiplier: </label>
                <input type="range" id="saturationMultiplier" min="0" max="200" value="50">
                <label for="valueMultiplier">Value Multiplier: </label>
                <input type="range" id="valueMultiplier" min="0" max="100" value="50">
            </div>
            <div class="imageOptions">
                <button id="submitBtn">Rainbowify Image</button>
                <a id="downloadBtn">
                    <button>Download Image</button>
                </a>
            </div>
        </main>
        <script src="index.js"></script>
    </body>
</html>
